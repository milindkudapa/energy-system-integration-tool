name: Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp index.html s3://${{ secrets.S3_BUCKET_NAME }}/gridwise/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Sync src files to S3 (short cache)
        run: |
          aws s3 sync src/ s3://${{ secrets.S3_BUCKET_NAME }}/gridwise/src/ \
            --delete \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/gridwise/*"

      - name: Print URL
        run: |
          DOMAIN=$(aws cloudfront get-distribution \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'Distribution.DomainName' \
            --output text)
          echo ""
          echo "=========================================="
          echo "  gridwise: https://$DOMAIN/gridwise/"
          echo "=========================================="
